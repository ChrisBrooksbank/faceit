           fill="hsl(116.32, 70%, 85%)"
           stroke="hsl(116.32, 50%, 60%)" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="114.32" cy="180" rx="15" ry="20" fill="#333"/>
  <ellipse cx="185.68" cy="180" rx="15" ry="20" fill="#333"/>

  <!-- Nose -->
  <path d="M 150 200 L 146 220 L 153 220 Z"
        fill="hsl(116.32, 50%, 70%)"/>

  <!-- Mouth -->
