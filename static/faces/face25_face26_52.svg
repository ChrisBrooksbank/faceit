<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#f5f5f5"/>

  <!-- Face outline -->
  <ellipse cx="150" cy="200" rx="105.47999999999999" ry="140"
           fill="hsl(250.76, 70%, 85%)"
           stroke="hsl(250.76, 50%, 60%)" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="107.25999999999999" cy="180" rx="15" ry="20" fill="#333"/>
  <ellipse cx="192.74" cy="180" rx="15" ry="20" fill="#333"/>

  <!-- Nose -->
  <path d="M 150 200 L 150 220 L 149 220 Z"
        fill="hsl(250.76, 50%, 70%)"/>

  <!-- Mouth -->
  <ellipse cx="150" cy="260" rx="30" ry="10"
           fill="hsl(250.76, 60%, 65%)"/>

  <!-- Pattern overlay (distinctive feature) -->
  <circle cx="100" cy="210" r="8" fill="hsl(250.76, 80%, 75%)" opacity="0.6"/>
     <circle cx="200" cy="210" r="8" fill="hsl(250.76, 80%, 75%)" opacity="0.6"/>

  <!-- Debug text (morphLevel indicator) -->
  <text x="150" y="380" text-anchor="middle" font-size="12" fill="#999">
    52% morph
  </text>
</svg>