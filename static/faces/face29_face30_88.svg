<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="400" fill="#f5f5f5"/>

  <!-- Face outline -->
  <ellipse cx="150" cy="200" rx="109.12" ry="140"
           fill="hsl(29.439999999999998, 70%, 85%)"
           stroke="hsl(29.439999999999998, 50%, 60%)" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="107.24" cy="180" rx="15" ry="20" fill="#333"/>
  <ellipse cx="192.76" cy="180" rx="15" ry="20" fill="#333"/>

  <!-- Nose -->
  <path d="M 150 200 L 154 220 L 155 220 Z"
        fill="hsl(29.439999999999998, 50%, 70%)"/>

  <!-- Mouth -->
  <ellipse cx="150" cy="260" rx="30" ry="18"
           fill="hsl(29.439999999999998, 60%, 65%)"/>

  <!-- Pattern overlay (distinctive feature) -->
  <line x1="100" y1="230" x2="110" y2="240" stroke="#999" stroke-width="1"/>
     <line x1="200" y1="230" x2="190" y2="240" stroke="#999" stroke-width="1"/>

  <!-- Debug text (morphLevel indicator) -->
  <text x="150" y="380" text-anchor="middle" font-size="12" fill="#999">
    88% morph
  </text>
</svg>